<body class="bg-slate-100">
  <style>
    #pre-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background-color: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease-out;
    }

    .loader-ring {
      width: 6rem;
      height: 6rem;
      border-radius: 50%;
      border-top: 2px solid #06b6d4;
      border-bottom: 2px solid #06b6d4;
      border-left: 2px solid transparent;
      border-right: 2px solid transparent;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .loader-text {
      color: #fff;
      font-family: monospace;
      letter-spacing: 0.1em;
      margin-top: 2rem;
      font-size: 0.8rem;
      color: rgba(6, 182, 212, 0.6);
    }
  </style>
  <div id="pre-loader">
    <div class="loader-ring"></div>
    <div class="loader-text">INITIALIZING...</div>
  </div>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
  <script>
    // Remove pre-loader when React mounts and handles its own loader
    // or simplistic timeout if React takes too long to hydrate
    window.onload = function () {
      const preLoader = document.getElementById('pre-loader');
      if (preLoader) {
        // We intentionally leave it to App.tsx to remove it or
        // we can remove it here if we want a double-safety.
        // But App.tsx has the 2-second timer.
        // However, App.tsx renders *inside* #root. 
        // If #pre-loader is z-index 99999, it covers #root.
        // We need App.tsx to be able to remove this pre-loader?
        // Or we just let App.tsx render its OWN loader on top?
        // Correct approach: App.tsx will mount. It ends up having its own Loader.
        // We should probably remove this static loader once App is running.

        // actually, let's let App.tsx remove this specific element if it exists?
        // OR just use a simple timeout here to fade it out, assuming App.tsx loader takes over?
        // The smoothest transition:
        // 1. Pre-loader shows immediately.
        // 2. App.tsx mounts, renders its OWN Loader (which looks identical).
        // 3. We remove Pre-loader.
        // 4. App.tsx Loader stays for 2 seconds.
        // 5. App.tsx Loader fades out.

        setTimeout(() => {
          preLoader.style.opacity = '0';
          setTimeout(() => {
            preLoader.remove();
          }, 500);
        }, 500); // Quick fade out after load, relying on React Loader to be present by then
      }
    };
  </script>
